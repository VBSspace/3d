<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-проекты — BVSspace</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--or:#e07020;--ink:#2b2724;--mut:#6a625b;--bg:#f4efe8}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:Montserrat,system-ui,sans-serif;padding:24px;text-align:center}
.mark{display:inline-flex;align-items:center;gap:10px;margin-bottom:28px}
.mark b{border:1.5px solid currentColor;padding:6px 10px;font-weight:800;font-size:18px}
.mark b span{font-weight:400}
.mark small{font-size:9px;letter-spacing:2.6px;text-transform:uppercase;line-height:1.45;text-align:left}
p{color:var(--mut);font-size:14px;line-height:1.6;max-width:420px;margin:0 auto 22px}
a.cta{display:inline-block;background:var(--or);color:#fff;text-decoration:none;font-weight:600;padding:14px 24px;border-radius:14px}
</style>
</head>
<body>
<main>
<div class="mark"><b>BVS<span>space</span></b><small>мебель<br>на заказ</small></div>
<p>Здесь хранятся 3D-модели проектов наших клиентов. Ссылку на свой проект вы получите от мастера.</p>
<a class="cta" href="https://vbsspace.github.io/anketa/proekt/">Рассчитать свой проект</a>
</main>
</body>
</html>
